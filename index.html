<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>As Per My Last Email</title>
    <meta name="description" content="A narrative choice-based office-sabotage game. Can you win without becoming the worst person in the room?" />
    <link rel="icon" href="assets/images/portrait-you.svg" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main id="game" class="layout">
      <img id="scene-bg" class="scene-bg" alt="" />
      <div class="vignette"></div>
      <img id="sprite" class="sprite hidden" alt="" />
      <img id="sprite-right" class="sprite winner hidden" alt="" />

      <div class="hud-top">
        <div id="day-label" class="day-label"></div>
        <div class="controls">
          <button class="toggle" data-target="inbox">✉ Inbox</button>
          <button class="toggle" data-target="stats-panel">★ Stats</button>
          <button class="toggle" data-target="rel-panel">🤝 Coworkers</button>
        </div>
      </div>

      <aside id="inbox" class="panel hidden"></aside>

      <section id="stage" class="stage"></section>

      <aside id="stats-panel" class="panel hidden">
        <div id="stats"></div>
      </aside>

      <aside id="rel-panel" class="panel hidden">
        <div id="relationships"></div>
      </aside>

      <button id="btn-restart" class="restart-btn">Restart</button>
    </main>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
